<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilmPlayer test</title>
<!-- Test page for js/film.js. Generate frames first: python3 tools/make_test_frames.py
     Serve the repo root (python3 -m http.server 8080) and open http://localhost:8080/tools/film-test.html -->
<style>
body{margin:0;font:14px/1.4 ui-monospace,monospace;background:#0b1016;color:#EAF2F8}
.film{height:500vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:6px;white-space:pre}
.after{height:60vh;display:grid;place-items:center}
</style>
</head>
<body>
<section class="film" id="film"><div class="stage"><canvas id="cv" aria-label="Test film"></canvas></div></section>
<div class="after">End of test film</div>
<div class="info" id="info">loading…</div>
<script src="../js/film.js"></script>
<script>
(async () => {
  const sec = document.getElementById('film'), info = document.getElementById('info');
  // A missing film must resolve to null without a network 404 (the registry in assets/films/index.json does not list it).
  window.missing = await FilmPlayer.load(document.createElement('canvas'), '../assets/films/does-not-exist/manifest.json');
  // The test film is not in the registry, so skip the registry check for it.
  const p = window.player = await FilmPlayer.load(document.getElementById('cv'), '../assets/films/_test/manifest.json', { registry: false });
  if (!p) { info.textContent = 'no test film: run python3 tools/make_test_frames.py'; return; }
  const progress = () => { const r = sec.getBoundingClientRect(), span = r.height - innerHeight; return Math.min(1, Math.max(0, -r.top / span)); };
  const update = () => p.draw(progress());
  addEventListener('scroll', update, { passive: true });
  const hud = () => { const s = p.state(); info.textContent = `variant ${s.variant}  frame ${s.target}/${s.count - 1}  drawn ${s.drawn}\nloaded ${s.loaded}  chunks [${s.chunks}]  inflight ${s.inflight}`; requestAnimationFrame(hud); };
  hud();
  await p.preload(0); update();
  window.filmReady = true;
  // With GSAP: ScrollTrigger.create({ trigger: sec, start: 'top top', end: 'bottom bottom', onUpdate: (st) => p.draw(st.progress) });
})();
</script>
</body>
</html>
